<div class="grid min-h-dvh bg-purple-50 lg:grid-cols-3">
  <main class="z-10 col-start-1 row-start-1 flex items-center justify-center p-4">
    <div class="w-full max-w-sm rounded-box lg:shadow-none lg:backdrop-blur-none">
      <router-outlet />
    </div>
  </main>
  <aside class="relative col-start-1 row-start-1 lg:col-start-2 lg:col-end-4" aria-hidden="true">
    @if(page(); as page){
    <app-image class="size-full" [imgSrc]="page.background" [altImg]="page.alt" [isPriority]="true"
      sizes="(min-width: 64rem) 67vw, 100vw" />
    }
  </aside>
</div>
