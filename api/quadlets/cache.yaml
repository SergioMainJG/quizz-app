apiVersion: v1
kind: Pod
metadata:
  name: cache
spec:
  restartPolicy: Always
  containers:
    - name: cache
      image: docker.io/valkey/valkey:8-alpine
      command: ["sh", "-c", 'exec valkey-server --requirepass "$REDIS_PASSWORD"']
      envFrom:
        - secretRef:
            name: cache-env
      ports:
        - containerPort: 6379
          hostPort: 6379
          hostIP: 127.0.0.1
      livenessProbe:
        exec:
          command: ["sh", "-c", 'valkey-cli -a "$REDIS_PASSWORD" ping']
        initialDelaySeconds: 15
        periodSeconds: 30
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: cache-data
