apiVersion: v1
kind: Pod
metadata:
  name: db
spec:
  restartPolicy: Always
  containers:
    - name: db
      image: docker.io/library/postgres:18-alpine
      envFrom:
        - secretRef:
            name: db-env
      ports:
        - containerPort: 5432
          hostPort: 5432
          hostIP: 127.0.0.1
      livenessProbe:
        exec:
          command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
        initialDelaySeconds: 15
        periodSeconds: 30
      volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: db-data
