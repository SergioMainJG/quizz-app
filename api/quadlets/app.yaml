apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  restartPolicy: Always
  initContainers:
    - name: migrate
      image: localhost/api:latest-build
      imagePullPolicy: Never
      command: ["bun", "run", "db:migrate"]
      envFrom:
        - secretRef:
            name: app-env
  containers:
    - name: app
      image: localhost/api:latest
      imagePullPolicy: Never
      envFrom:
        - secretRef:
            name: app-env
      env:
        - name: NODE_ENV
          value: production
        - name: HOST
          value: 127.0.0.1
        - name: PORT
          value: "3000"
      livenessProbe:
        exec:
          command:
            [
              "bun",
              "-e",
              "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
            ]
        initialDelaySeconds: 10
        periodSeconds: 30
